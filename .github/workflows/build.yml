name: Build launchers

# Compila los ejecutables en los runners de GitHub (Windows y macOS)
# y los sube como artifacts descargables. No necesita una PC Windows a mano.

on:
  push:
    tags: ["v*"]          # al publicar un tag v1.0.0 -> adjunta a un Release
  workflow_dispatch: {}   # o dispararlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: KarmedExport-windows
            binary: dist/KarmedExport.exe
          - os: macos-latest
            artifact: KarmedExport-macos
            binary: dist/KarmedExport
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies (incl. dev)
        run: uv sync

      - name: Build executable
        run: uv run pyinstaller KarmedExport.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary }}
